# Why pyproject.toml and not requirements.txt:
#   pyproject.toml is the PEP 621 standard. uv reads it directly,
#   pip reads it (modern pip), and it carries both runtime deps and
#   tool config (pytest, ruff) in one file — fewer files to drift.
#
# Why uv (not pip + venv): uv resolves and installs ~10x faster than pip.
# Wei's other portfolio projects already use uv; matching the convention
# means the same `uv sync` works across all of them.

# build-system is required for `pip install -e .` (the fallback path in
# scripts/bootstrap.sh when uv isn't installed yet). uv has its own
# resolver and doesn't strictly need this, but committing it costs nothing
# and unblocks the pip path.
[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onclab"]

[project]
name = "onclab"
version = "0.1.4"
description = "Local oncology RAG testbed: Ollama + LlamaIndex + DeepEval + Phoenix"
requires-python = ">=3.11"

dependencies = [
    # ---- Inference + RAG layer ----
    # ollama: thin Python wrapper around the local Ollama HTTP API at :11434.
    # Used directly when LlamaIndex is overkill (e.g., a one-shot extraction prompt).
    "ollama>=0.3",

    # llama-index core + ollama integration: builds the retrieval pipeline.
    # Picked over LangChain because retrieval is ~40% faster and uses
    # ~33% fewer tokens per query (per 2025 benchmarks). For a doc-heavy
    # RAG project this is the cleaner abstraction; LangChain is better
    # when you need agent chains (this project doesn't).
    "llama-index-core>=0.11",
    "llama-index-llms-ollama>=0.3",
    "llama-index-embeddings-ollama>=0.3",
    "llama-index-vector-stores-chroma>=0.2",

    # chromadb: file-based vector store. Zero ops, persists to disk.
    # Alternatives (Qdrant, Weaviate, Pinecone) are production-grade
    # but require a server; for a personal lab, file-based wins on
    # setup cost and reproducibility.
    "chromadb>=0.5",

    # ---- Eval + observability ----
    # deepeval: pytest-native LLM evaluation. Each metric runs as a
    # pytest assertion, so the eval suite slots into the same CI as
    # everything else. The interview-relevant claim is "I run LLM
    # evals as pytest gates" — this is the library that lets you do that.
    "deepeval>=1.0",

    # arize-phoenix: local observability. Captures full traces of every
    # RAG call (retrieval -> context -> generation), serves a UI at :6006.
    # OpenInference is the OpenTelemetry-on-LLMs flavor; the LlamaIndex
    # auto-instrumentor wires it up without manual span code.
    "arize-phoenix>=4.0",
    "openinference-instrumentation-llama-index>=2.0",

    # ---- Glue ----
    "pydantic>=2.7",   # entity-extraction output validation
    "typer>=0.12",     # CLI: `onclab ingest`, `onclab extract`, `onclab eval`
    "rich>=13.7",      # readable terminal output for the CLI
]

[project.scripts]
# This wires `onclab` as a command on PATH after install.
# So you run `onclab ingest` instead of `python -m onclab.cli ingest`.
onclab = "onclab.cli:app"

[dependency-groups]
# Dev-only deps (don't ship to production users — this stays a local lab,
# but keeping the split is good practice and matches Wei's other projects).
dev = [
    "pytest>=8.2",
    "pytest-json-report>=1.5",  # writes results to JSON for the regression gate
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest markers let us split fast unit tests from slow eval runs.
# `pytest -m "not eval"` runs only unit tests (CI on every push).
# `pytest -m eval` runs the DeepEval suite (slower; nightly or pre-merge).
markers = [
    "eval: LLM evaluation tests (require Ollama running unless MOCK_LLM=1)",
    "drift: cross-version drift comparison (slow)",
    "live_embedding: live Ollama embedding A/B (requires ONCLAB_RUN_LIVE_EMBEDDING_AB=1)",
    "live_injection: live Ollama injection corpus smoke (requires ONCLAB_RUN_LIVE_INJECTION=1)",
]

[tool.ruff]
# 120 keeps test string literals (clinical phrases, JSON fixtures) on one
# line. Going wider hurts side-by-side diff readability; staying narrower
# forces ugly mid-string breaks in test data.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes basics
# I   = import sorting
# UP  = pyupgrade (modern syntax)
# B   = bugbear (likely bugs / bad patterns)
select = ["E", "F", "I", "UP", "B"]

# B008 fires on typer's `arg: T = typer.Option(...)` pattern, but typer
# literally requires that idiom — the function call IS how typer captures
# the option metadata. Disable globally; we don't use that pattern outside
# the typer CLI.
ignore = ["B008"]

[tool.uv]
# Universal lock must resolve for CI (linux x86_64) and local dev on both Mac
# architectures. onnxruntime 1.26+ dropped Intel-mac wheels; ChromaDB pulls it
# transitively for its default embedding path (this project uses Ollama instead).
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
override-dependencies = [
    "onnxruntime==1.23.2",
]
